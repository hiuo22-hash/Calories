<title>하루 기록</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">

<div class="app">
  <header class="topbar">
    <button id="prevDay" class="icon-btn" aria-label="이전 날">‹</button>
    <div class="date-wrap">
      <span id="dateLabel" class="date-label">불러오는 중</span>
      <input type="date" id="datePicker" class="date-picker" aria-label="날짜 선택">
    </div>
    <button id="nextDay" class="icon-btn" aria-label="다음 날">›</button>
    <button id="todayBtn" class="text-btn" hidden>오늘</button>
  </header>

  <!-- 기록 화면 -->
  <section id="dayView" class="view">
    <div class="summary" id="summary">
      <div class="stat"><span class="stat-label">섭취</span><b id="sumIn" class="num c-in">0</b><small id="sumInNote">kcal</small></div>
      <div class="stat"><span class="stat-label">소모</span><b id="sumOut" class="num c-out">0</b><small id="sumOutDetail"></small></div>
      <div class="stat"><span class="stat-label">차이</span><b id="sumNet" class="num">0</b><small id="sumNetNote"></small></div>
    </div>
    <div class="goals" id="goals" hidden>
      <div class="meter">
        <div class="meter-head"><span>섭취 목표</span><span id="goalInText" class="num"></span></div>
        <div class="bar"><i id="goalInBar"></i></div>
      </div>
      <div class="meter">
        <div class="meter-head"><span>이번 주 운동</span><span id="goalExText" class="num"></span></div>
        <div class="bar"><i id="goalExBar" class="ex"></i></div>
      </div>
    </div>
    <div id="importantBar" class="important-bar" hidden></div>

    <main id="scroller" class="scroller">
      <div id="timeline" class="timeline">
        <div id="grid" class="grid"></div>
        <div id="events" class="events"></div>
        <div id="nowLine" class="now-line" hidden></div>
      </div>
      <p id="emptyHint" class="empty-hint" hidden>빈 시간대를 탭하거나 + 버튼으로 첫 기록을 남겨 보세요.<br>블록은 꾹 눌러 옮기고, 아래 끝을 끌어 길이를 바꿉니다.</p>
    </main>
    <button id="fab" class="fab" aria-label="기록 추가">+</button>
  </section>

  <!-- 통계 화면 -->
  <section id="statsView" class="view stats" hidden>
    <div class="stats-head">
      <div class="seg" role="tablist">
        <button type="button" data-range="week" class="on">주간</button>
        <button type="button" data-range="month">월간</button>
      </div>
      <div class="period">
        <button id="prevPeriod" class="icon-btn" aria-label="이전 기간">‹</button>
        <span id="periodLabel"></span>
        <button id="nextPeriod" class="icon-btn" aria-label="다음 기간">›</button>
      </div>
    </div>
    <div class="stats-body">
      <div class="tiles" id="statTiles"></div>
      <figure class="chart-card">
        <figcaption>
          <h3>섭취와 소모</h3>
          <div class="legend"><span><i class="sw in"></i>섭취</span><span><i class="sw out"></i>소모</span><span id="goalLegend"><i class="sw goal"></i>섭취 목표</span></div>
        </figcaption>
        <div class="tip" id="tipKcal">막대를 누르면 그날 수치가 보여요</div>
        <div id="chartKcal" class="chart"></div>
      </figure>
      <figure class="chart-card">
        <figcaption><h3>운동 시간 (분)</h3></figcaption>
        <div class="tip" id="tipEx">막대를 누르면 그날 수치가 보여요</div>
        <div id="chartEx" class="chart"></div>
      </figure>
      <details class="table-card">
        <summary>날짜별 표로 보기</summary>
        <div class="table-wrap"><table id="statsTable"></table></div>
      </details>
    </div>
  </section>

  <nav class="tabbar">
    <button type="button" data-tab="day" class="on">기록</button>
    <button type="button" data-tab="stats">통계</button>
    <button type="button" data-tab="routines">루틴</button>
    <button type="button" data-tab="settings">설정</button>
  </nav>
</div>

<!-- 기록 편집 -->
<div id="editorSheet" class="backdrop" hidden>
  <form id="editor" class="sheet" autocomplete="off">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-close>취소</button>
      <h2 id="editorTitle">새 기록</h2>
      <button type="submit" class="primary-btn">저장</button>
    </div>
    <div class="sheet-body">
      <div class="type-chips" id="typeChips">
        <button type="button" data-type="daily"><i class="dot t-daily"></i>일상</button>
        <button type="button" data-type="exercise"><i class="dot t-exercise"></i>운동</button>
        <button type="button" data-type="meal"><i class="dot t-meal"></i>식사</button>
        <button type="button" data-type="event"><i class="dot t-event"></i>일정</button>
      </div>

      <label class="field"><span>제목</span><input id="fTitle" placeholder="무엇을 했나요?"></label>

      <div class="row">
        <label class="field"><span>시작</span><input type="time" id="fStart" step="300" required></label>
        <label class="field"><span>종료</span><input type="time" id="fEnd" step="300" required></label>
      </div>
      <p class="hint" id="fDuration"></p>

      <label class="switch"><input type="checkbox" id="fImportant"><span><b class="star">★</b> 중요 표시</span></label>

      <section id="exerciseBox" class="typebox">
        <label class="field"><span>운동 종류</span><select id="fExercise"></select></label>
        <p class="hint" id="metNote"></p>
      </section>

      <section id="mealBox" class="typebox">
        <label class="field"><span>먹은 것 (자유롭게 적기)</span>
          <textarea id="fFoodText" rows="2" placeholder="예: 김치찌개 반 그릇, 밥 2/3공기, 계란후라이 1개"></textarea>
        </label>
        <div class="ai-row">
          <p class="hint" id="aiStatus"></p>
          <button type="button" id="aiBtn" class="ghost-btn small" hidden>지금 AI로 계산</button>
        </div>
        <ul id="aiItems" class="ai-items"></ul>
        <label class="field"><span>목록에서 빠르게 추가</span><input id="foodSearch" placeholder="예: 라떼, 삼겹살" enterkeyhint="search"></label>
        <div id="foodResults" class="food-results"></div>
        <ul id="foodList" class="food-list"></ul>
      </section>

      <div id="kcalBox" class="kcal-box">
        <label class="field"><span id="kcalLabel">칼로리</span><input type="number" id="fKcal" inputmode="numeric" min="0"></label>
        <button type="button" id="kcalAuto" class="text-btn">자동 계산으로</button>
      </div>

      <label class="field"><span>메모</span><textarea id="fMemo" rows="3" placeholder="세부 내용, 느낀 점 등"></textarea></label>

      <label class="switch"><input type="checkbox" id="fToCal"><span>구글 캘린더에 보내기 <small>(연동 후 적용)</small></span></label>

      <button type="button" id="deleteBtn" class="danger-btn">이 기록 삭제</button>
    </div>
  </form>
</div>

<!-- 루틴 -->
<div id="routineSheet" class="backdrop" hidden>
  <form id="routineForm" class="sheet" autocomplete="off">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-close>닫기</button>
      <h2>하루 루틴</h2>
      <span class="head-spacer"></span>
    </div>
    <div class="sheet-body">
      <p class="hint">자주 반복되는 하루 일과를 저장해 두고, 버튼 하나로 보고 있는 날에 한꺼번에 넣습니다.</p>
      <ul id="routineList" class="routine-list"></ul>
      <h3>보고 있는 날을 루틴으로 저장</h3>
      <div class="row end">
        <label class="field"><span>루틴 이름</span><input id="routineName" placeholder="예: 평일 루틴"></label>
        <button type="submit" class="primary-btn">저장</button>
      </div>
      <p class="hint" id="routineNote"></p>
    </div>
  </form>
</div>

<!-- 설정 -->
<div id="settingsSheet" class="backdrop" hidden>
  <form id="settings" class="sheet" autocomplete="off">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-close>닫기</button>
      <h2>내 정보 · 목표</h2>
      <button type="submit" class="primary-btn">저장</button>
    </div>
    <div class="sheet-body">
      <p class="hint" id="profileNote">기초대사량을 계산하려면 내 정보를 입력해 주세요.</p>
      <div class="row">
        <label class="field"><span>성별</span>
          <select id="pSex"><option value="m">남성</option><option value="f">여성</option></select>
        </label>
        <label class="field"><span>나이</span><input type="number" id="pAge" inputmode="numeric" min="10" max="100" required></label>
      </div>
      <div class="row">
        <label class="field"><span>키 (cm)</span><input type="number" id="pHeight" inputmode="decimal" min="100" max="230" step="0.1" required></label>
        <label class="field"><span>체중 (kg)</span><input type="number" id="pWeight" inputmode="decimal" min="25" max="250" step="0.1" required></label>
      </div>
      <label class="field"><span>평소 일상 활동 (운동 제외)</span>
        <select id="pActivity">
          <option value="1">기초대사량만 계산</option>
          <option value="1.2">대부분 앉아서 생활 (사무직)</option>
          <option value="1.3">서서 일하거나 많이 걷는 편</option>
          <option value="1.45">육체 노동이 많은 편</option>
        </select>
      </label>
      <div class="bmr-box" id="bmrPreview"></div>

      <h3>목표</h3>
      <div class="row end">
        <label class="field"><span>하루 섭취 목표 (kcal)</span><input type="number" id="gIntake" inputmode="numeric" min="800" max="6000" step="50"></label>
        <button type="button" id="gSuggest" class="ghost-btn small">추천값 넣기</button>
      </div>
      <p class="hint" id="gSuggestNote"></p>
      <div class="row">
        <label class="field"><span>주간 운동 시간 (분)</span><input type="number" id="gExMin" inputmode="numeric" min="0" max="3000" step="10"></label>
        <label class="field"><span>주간 운동 횟수</span><input type="number" id="gExCount" inputmode="numeric" min="0" max="21"></label>
      </div>

      <p class="hint" id="storageNote"></p>
    </div>
  </form>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
